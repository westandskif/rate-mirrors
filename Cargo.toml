[package]
name = "rate_mirrors"
version = "0.34.4"
authors = ["Nikita Almakov <nikita.almakov@gmail.com>"]
edition = "2024"
description = "Everyday-use client-side map-aware mirror ranking tool (Arch Linux; Manjaro; custom ones)"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "http2", "macos-system-configuration", "rustls-tls-native-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net"] }
futures = { version = "0.3", default-features = false, features = ["alloc"] } # An implementation of futures and streams featuring zero allocations, composability, and itera…
serde_json = "1"      # A JSON serialization file format
byte-unit = "5"     # A library for interaction with units of bytes
itertools = "0.14"    # Extra iterator adaptors, iterator methods, free functions, and macros.
ambassador = "0.4"    # Deriving the delegating trait implementation via procedural macros.
thiserror = "1"
rand = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
nix = { version = "0.29", default-features = false, features = ["user"] }
url = { version = "2", features = ["serde"] }
clap = { version = "4.5.31", features = ["derive", "unstable-doc", "env"] }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# macOS defaults debug builds to "unpacked": each relink leaves its *.rcgu.o files in
# target/debug/deps, untracked by cargo, so they pile up. "packed" writes one .dSYM.
[profile.dev]
split-debuginfo = "packed"
# File:line backtraces only (no variable info for lldb): smaller debuginfo, faster links.
debug = "line-tables-only"
